<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SkySwitch - Weather Based Activity Suggestions</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    
    <!-- NAVIGATION BAR -->
    <header class="navbar">
      <a href="#" class="logo">SKY SWITCH</a>

      <nav>
        <a href="#map-section">MAP</a>
        <a href="#weather-section">WEATHER</a>
        <a href="#activities-section">ACTIVITIES</a>
      </nav>
    </header>

    <!-- MAIN WEBSITE CONTENT -->
    <main class="main-layout">
      <!-- LEFT COLUMN -->
      <section class="left-column">
        <!-- API KEY -->
        <div class="api-section">
          <label for="apiKey">OpenWeather API Key</label>

          <input
            type="password"
            id="apiKey"
            placeholder="Enter API key"
            autocomplete="off"
          />

          <label for="geoapifyKey">Geoapify API Key</label>

          <input
            type="password"
            id="geoapifyKey"
            placeholder="Enter your Geoapify API key"
            autocomplete="off"
          />
        </div>

        
    </main>

    <!-- FOOTER -->
    <footer>
      <p>SKY SWITCH</p>
      <span> Discover activities that match your weather. </span>
    </footer>

    <!-- LEAFLET JAVASCRIPT -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- CUSTOM JAVASCRIPT -->
    <script src="script.js"></script>
  </body>
</html>
